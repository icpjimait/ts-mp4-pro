appId: com.ts2mp4.pro
productName: TS转MP4 专家版
directories:
  output: dist # 打包产物的输出文件夹
  buildResources: resources

# 核心：定义哪些编译后的代码和前端资源需要打包进去
files:
  - out/main/**/*
  - out/preload/**/*
  - out/renderer/**/*

# Windows 平台的打包配置
win:
  signAndEditExecutable: false
  target:
    - target: nsis
      arch:
        - x64 # 仅打包 64 位版本，大幅缩小安装包体积
    - target: portable
      arch:
        - x64
  # icon: resources/icon.ico # 如果有定制的图标，取消这一行的注释，并在 resources 放入 icon.ico 文件

# ✨ NSIS 专业安装向导配置
nsis:
  oneClick: false                           # 禁用一键傻瓜式安装，开启高级引导
  allowToChangeInstallationDirectory: true # 允许用户点击“浏览”自主修改安装路径（比如安装到 D 盘）
  perMachine: true                          # 为这台电脑的所有系统用户安装
  createDesktopShortcut: true              # 安装完成后自动在桌面创建快捷方式
  createStartMenuShortcut: true             # 在开始菜单创建快捷方式
  shortcutName: TS转MP4 专家版              # 快捷方式的中文名称
  uninstallDisplayName: TS转MP4 专家版 (卸载) # 卸载程序的名称
  deleteAppDataOnUninstall: true           # 卸载时顺便清理用户本地的 localStorage 缓存
